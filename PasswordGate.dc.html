<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ gateRef }}" role="dialog" aria-modal="true" aria-labelledby="gate-title" data-screen-label="Password Gate" style="position:fixed; inset:0; z-index:100; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; font-family:Inter, system-ui, sans-serif; color:#111214; background:rgba(250,250,248,0.62); backdrop-filter:blur(30px) saturate(140%); -webkit-backdrop-filter:blur(30px) saturate(140%);">
    <div aria-hidden="true" style="position:fixed; inset:0; z-index:-1; background:radial-gradient(rgba(17,18,20,0.07) 1px, transparent 1.3px) 0 0 / 22px 22px; -webkit-mask-image:radial-gradient(55% 55% at 50% 50%, #000, transparent 80%); mask-image:radial-gradient(55% 55% at 50% 50%, #000, transparent 80%); pointer-events:none;"></div>
    <div aria-hidden="true" style="position:fixed; left:50%; top:52%; z-index:-1; width:min(760px, 92vw); height:min(760px, 92vw); transform:translate(-50%, -50%); border-radius:50%; background:radial-gradient(closest-side, oklch(0.78 0.09 265 / 0.5), oklch(0.86 0.05 300 / 0.22) 60%, transparent 100%); filter:blur(50px); pointer-events:none;"></div>
    <div style="display:flex; align-items:center; padding:16px clamp(20px, 4vw, 64px);">
      <a href="{{ backHref }}" onMouseEnter="{{ hoverOn }}" onMouseLeave="{{ hoverOff }}" style="display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px 0 14px; border-radius:999px; background:rgba(255,255,255,0.7); backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%); border:1px solid rgba(17,18,20,0.07); box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), 0 1px 2px rgba(17,18,20,0.04), 0 10px 28px -14px rgba(17,18,20,0.22); font-size:14px; font-weight:500; color:#111214; text-decoration:none;"><span style="display:inline-block; transform:translateX(calc(var(--h, 0) * -3px)); transition:transform 400ms cubic-bezier(.2,.7,.2,1);">←</span>{{ backLabel }}</a>
    </div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:16px 20px 72px;">
      <form ref="{{ formRef }}" onSubmit="{{ submit }}" style="width:min(100%, 440px); box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:28px; padding:clamp(32px, 4vw, 48px) clamp(22px, 3.4vw, 44px); border-radius:32px; background:rgba(255,255,255,0.82); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); border:1px solid rgba(255,255,255,0.92); box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), 0 1px 2px rgba(17,18,20,0.04), 0 50px 100px -50px rgba(17,18,20,0.4); text-align:center;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:20px;">
          <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center; width:60px; height:60px; border-radius:999px; background:#111214; color:#ffffff; box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 14px 30px -14px rgba(17,18,20,0.6);">
            <sc-if value="{{ notOk }}" hint-placeholder-val="{{ true }}">
              <svg viewBox="0 0 24 24" style="display:block; width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"></path><path d="M12 14.5v2"></path></svg>
            </sc-if>
            <sc-if value="{{ ok }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 24 24" style="display:block; width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 6.8-1.2"></path><path d="M9.5 15.5l1.8 1.8 3.4-3.6"></path></svg>
            </sc-if>
          </span>
          <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
            <span style="display:inline-flex; align-items:center; height:26px; padding:0 12px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; background:#ffffff; border:1px solid rgba(17,18,20,0.08); box-shadow:0 1px 2px rgba(17,18,20,0.04); color:#4a4d53;">{{ eyebrow }}</span>
            <h1 id="gate-title" style="margin:0; font-weight:500; font-size:clamp(30px, 3vw, 40px); line-height:1.02; letter-spacing:-0.04em; text-wrap:balance;">{{ title }}</h1>
            <p style="margin:0; max-width:34ch; font-size:15.5px; line-height:1.55; color:#5c5f63; text-wrap:pretty;">Some work includes client details shared under NDA. If you were sent a password, enter it below.</p>
          </div>
        </div>
        <div style="width:100%; display:flex; flex-direction:column; gap:10px; text-align:left;">
          <label for="gate-pw" style="padding-left:4px; font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#7a7d83;">Password</label>
          <div style="position:relative;">
            <input id="gate-pw" ref="{{ inputRef }}" type="{{ pwType }}" value="{{ pw }}" onChange="{{ onPw }}" onFocus="{{ onFocusPw }}" onBlur="{{ onBlurPw }}" autocomplete="current-password" placeholder="Enter password" aria-invalid="{{ err }}" style="width:100%; box-sizing:border-box; height:52px; padding:0 84px 0 20px; border-radius:999px; background:#ffffff; border:1px solid {{ inputBorder }}; outline:none; box-shadow:{{ inputRing }}; font-family:Inter, system-ui, sans-serif; font-size:16px; color:#111214; transition:border-color 200ms ease, box-shadow 200ms ease;">
            <button type="button" onClick="{{ togglePw }}" style="position:absolute; top:6px; right:6px; height:40px; padding:0 14px; border:0; border-radius:999px; background:#f1f2f4; font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:500; color:#3f4247; cursor:pointer; transition:background 200ms ease;" style-hover="background:#e6e7ea;">{{ eyeLabel }}</button>
          </div>
          <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}">
            <span role="alert" style="padding-left:4px; font-size:13.5px; line-height:1.4; color:oklch(0.52 0.2 25);">That password didn’t work. Try again.</span>
          </sc-if>
        </div>
        <button type="submit" onMouseEnter="{{ hoverOn }}" onMouseLeave="{{ hoverOff }}" style="width:100%; height:52px; display:inline-flex; align-items:center; justify-content:center; gap:10px; border:0; border-radius:999px; background:#111214; font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:500; color:#ffffff; cursor:pointer; box-shadow:0 10px 24px -12px rgba(17,18,20,0.55); transition:background 200ms ease;" style-hover="background:#2a2c30;">{{ submitLabel }} <span style="display:inline-block; transform:translateX(calc(var(--h, 0) * 4px)); transition:transform 400ms cubic-bezier(.2,.7,.2,1);">→</span></button>
        <p style="margin:0; font-size:14px; color:#7a7d83;">Don’t have it? <a href="mailto:dmotacontact@gmail.com?subject=Portfolio%20access%20request" style="font-weight:500; color:#111214; text-decoration:underline; text-underline-offset:3px;">Request access</a></p>
      </form>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;enabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;password&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AI_Is_Cool&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Private Case Study&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;This project is password protected&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;backHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;backLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static KEY = 'dm-portfolio-unlocked';
  state = { locked: this.initLocked(), pw: '', err: false, show: false, ok: false, focus: false };
  inputRef = React.createRef();
  formRef = React.createRef();
  gateRef = React.createRef();
  initLocked() {
    try {
      if (localStorage.getItem('dm-portfolio-unlocked') === '1') return false;
      if (sessionStorage.getItem('dm-portfolio-unlocked') === '1') { localStorage.setItem('dm-portfolio-unlocked', '1'); return false; }
    } catch (_) {}
    return true;
  }
  isLocked() { return this.state.locked && (this.props.enabled ?? true); }
  syncLock() { document.body.style.overflow = this.isLocked() ? 'hidden' : ''; }
  onPw = (e) => this.setState({ pw: e.target.value, err: false });
  onFocusPw = () => this.setState({ focus: true });
  onBlurPw = () => this.setState({ focus: false });
  togglePw = () => this.setState(s => ({ show: !s.show }));
  hoverOn = (e) => e.currentTarget.style.setProperty('--h', '1');
  hoverOff = (e) => e.currentTarget.style.setProperty('--h', '0');
  onStorage = (e) => { if (e.key === 'dm-portfolio-unlocked' && e.newValue === '1') this.setState({ locked: false }); };
  submit = (e) => {
    e.preventDefault();
    if (this.state.ok) return;
    const pass = String(this.props.password ?? 'AI_Is_Cool').trim();
    if (this.state.pw.trim() === pass) {
      try { localStorage.setItem('dm-portfolio-unlocked', '1'); } catch (_) {}
      this.setState({ ok: true, err: false });
      const done = () => this.setState({ locked: false });
      const g = this.gateRef.current;
      if (this.reduce || !g) { done(); return; }
      setTimeout(() => { const a = g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 550, easing: 'ease', fill: 'forwards' }); a.onfinish = done; }, 650);
    } else {
      this.setState({ err: true });
      const f = this.formRef.current;
      if (f && !this.reduce) f.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, { transform: 'translateX(9px)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 460, easing: 'ease-out' });
      const i = this.inputRef.current; if (i) i.select();
    }
  };
  componentDidMount() {
    this.reduce = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.addEventListener('storage', this.onStorage);
    this.syncLock();
    if (this.isLocked()) setTimeout(() => { const i = this.inputRef.current; if (i) i.focus({ preventScroll: true }); }, 350);
  }
  componentDidUpdate() { this.syncLock(); }
  componentWillUnmount() { window.removeEventListener('storage', this.onStorage); document.body.style.overflow = ''; }
  renderVals() {
    const s = this.state;
    return {
      locked: this.isLocked(),
      gateRef: this.gateRef, formRef: this.formRef, inputRef: this.inputRef,
      backHref: this.props.backHref ?? '/',
      backLabel: this.props.backLabel ?? 'Home',
      eyebrow: this.props.eyebrow ?? 'Private Case Study',
      title: this.props.title ?? 'This project is password protected',
      submit: this.submit, onPw: this.onPw, onFocusPw: this.onFocusPw, onBlurPw: this.onBlurPw, togglePw: this.togglePw,
      hoverOn: this.hoverOn, hoverOff: this.hoverOff,
      pw: s.pw, err: s.err, ok: s.ok, notOk: !s.ok,
      pwType: s.show ? 'text' : 'password',
      eyeLabel: s.show ? 'Hide' : 'Show',
      submitLabel: s.ok ? 'Unlocked' : 'Unlock',
      inputBorder: s.err ? 'oklch(0.6 0.2 25)' : s.focus ? 'oklch(0.55 0.21 275)' : '#e3e3e8',
      inputRing: s.err ? '0 0 0 4px oklch(0.6 0.2 25 / 0.12)' : s.focus ? '0 0 0 4px oklch(0.55 0.21 275 / 0.14)' : 'none'
    };
  }
}
</script>
</body>
</html>
